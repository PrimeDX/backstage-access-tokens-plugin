name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run verification suite
        run: npm run ci 2>&1 | tee verify.log

      - name: Upload verification log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-log
          path: verify.log
          if-no-files-found: ignore

  security-publishable:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run publishable dependency security gate
        run: npm run security:publishable

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - verify
      - security-publishable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install harness dependencies
        run: cd e2e/harness && yarn install --immutable

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke test
        run: npm run test:ui-smoke
        env:
          PLAYWRIGHT_HARNESS_DIR: e2e/harness
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_USE_SYSTEM_CHROME: "false"

      - name: Upload UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
