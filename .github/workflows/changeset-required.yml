name: Changeset Required

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-required:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch pull request base branch
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Require a changeset for publishable changes
        run: node scripts/changeset-required.mjs ${{ github.event.pull_request.base.sha }}
