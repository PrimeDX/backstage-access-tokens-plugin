name: OSV-Scanner PR Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-pr:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.0
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --recursive
        ./
