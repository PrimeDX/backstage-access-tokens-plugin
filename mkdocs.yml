site_name: Backstage Service Token Plugin
site_description: Documentation for the Backstage Service Token Plugin — lifecycle management for machine-to-machine service tokens.
docs_dir: docs

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - REST API: api.md
  - Architecture: architecture.md
  - Testing: testing.md
  - Releasing: releasing.md
  - Production Readiness: production-readiness.md
  - Runbooks:
      - Scope Enforcement: runbooks/scope-enforcement.md

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
