site_name: Backstage Access Tokens Plugin
site_description: Documentation for the Backstage Access Tokens Plugin — lifecycle management for personal access tokens and service tokens.
docs_dir: docs

nav:
  - Home: index.md
  - Tutorials:
      - Build a Backstage App: tutorials/build-a-backstage-app.md
  - How-To Guides:
      - Install in an Existing App: how-to/install.md
      - Test the Plugin: how-to/test.md
      - Test Local Package Changes: how-to/test-local-changes.md
      - Prepare for Production: how-to/production.md
      - Enforce Service Token Scopes: how-to/enforce-scopes.md
      - Contribute with Git: how-to/contribute-with-git.md
      - Release to npm: how-to/release.md
  - Reference:
      - REST API: reference/rest-api.md
      - Configuration: reference/configuration.md
      - Contract Decisions: reference/contract-decisions.md
  - Explanation:
      - Architecture: explanation/architecture.md
  - Maintainers:
      - Spec Knowledge Base: spec/index.md
      - User Tokens Overview: spec/user-tokens-overview.md
      - User Tokens API and Schema: spec/user-tokens-api.md
      - User Tokens Architecture: spec/user-tokens-architecture.md
      - User Tokens Verification: spec/user-tokens-verification.md
      - Research Notes: spec/research-notes.md

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
